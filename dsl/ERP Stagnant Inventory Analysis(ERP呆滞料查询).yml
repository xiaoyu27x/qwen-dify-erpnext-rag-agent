    - data:
        code: "import json\nfrom datetime import datetime, date\n\n\ndef main(body:\
          \ str, idle_days: int, item: dict):\n    try:\n        data = json.loads(body)\
          \ if isinstance(body, str) else body\n    except Exception:\n        data\
          \ = {}\n\n    rows = data.get(\"data\", []) if isinstance(data, dict) else\
          \ []\n\n    # 直接从当前迭代 item 里拿库存信息\n    item_code = item.get(\"item_code\"\
          , \"\")\n    warehouse = item.get(\"warehouse\", \"\")\n    actual_qty =\
          \ item.get(\"actual_qty\", 0)\n    valuation_rate = item.get(\"valuation_rate\"\
          , 0)\n    stock_value = item.get(\"stock_value\", 0)\n\n    valid_rows =\
          \ []\n\n    for row in rows:\n        posting_date = row.get(\"posting_date\"\
          )\n\n        if posting_date:\n            try:\n                d = datetime.strptime(\n\
          \                    str(posting_date)[:10],\n                    \"%Y-%m-%d\"\
          \n                ).date()\n\n                valid_rows.append((d, row))\n\
          \            except Exception:\n                pass\n\n    # 没有库存流水\n \
          \   if not valid_rows:\n        return {\n            \"result\": {\n  \
          \              \"item_code\": item_code,\n                \"warehouse\"\
          : warehouse,\n                \"actual_qty\": actual_qty,\n            \
          \    \"valuation_rate\": valuation_rate,\n                \"stock_value\"\
          : stock_value,\n                \"last_date\": \"\",\n                \"\
          idle_days_actual\": 999999,\n                \"idle_days_limit\": int(idle_days),\n\
          \                \"is_idle\": True\n            }\n        }\n\n    # 找最新库存变动日期\n\
          \    last_date, last_row = max(valid_rows, key=lambda x: x[0])\n\n    days\
          \ = (date.today() - last_date).days\n\n    return {\n        \"result\"\
          : {\n            \"item_code\": item_code,\n            \"warehouse\": warehouse,\n\
          \            \"actual_qty\": actual_qty,\n            \"valuation_rate\"\
          : valuation_rate,\n            \"stock_value\": stock_value,\n         \
          \   \"last_date\": last_date.strftime(\"%Y-%m-%d\"),\n            \"idle_days_actual\"\
          : days,\n            \"idle_days_limit\": int(idle_days),\n            \"\
          is_idle\": days >= int(idle_days)\n        }\n    }"
        code_language: python3
