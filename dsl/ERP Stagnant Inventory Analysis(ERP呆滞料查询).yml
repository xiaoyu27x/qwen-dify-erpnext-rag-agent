    - data:
        code: "import json\n\ndef main(body: str, min_stock_value: float) -> dict:\n\
          \n    # 1. HTTP body 字符串转 JSON\n    data = json.loads(body)\n\n    # ERPNext\
          \ REST API 返回格式通常为：\n    # {\"data\": [...]}\n    rows = data.get(\"data\"\
          , [])\n\n    # 2. 过滤库存金额\n    filtered = []\n\n    for row in rows:\n  \
          \      stock_value = row.get(\"stock_value\", 0) or 0\n\n        try:\n\
          \            stock_value = float(stock_value)\n        except:\n       \
          \     stock_value = 0\n\n        if stock_value > float(min_stock_value):\n\
          \            filtered.append(row)\n\n    # 3. 返回结果\n    return {\n     \
          \   \"filtered_data\": filtered,\n        \"count\": len(filtered)\n   \
          \ }"
